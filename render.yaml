services:
  - type: web
    name: bookshop-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bookshop-postgres
          property: connectionString
      - key: APP_ORIGIN
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_PUBLIC_BUCKET
        sync: false
      - key: S3_PRIVATE_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ORDER_CONFIRMATION_FROM_EMAIL
        sync: false
      - key: LEGAL_BUSINESS_NAME
        sync: false
      - key: LEGAL_CONTACT_EMAIL
        sync: false
      - key: LEGAL_BUSINESS_ADDRESS
        sync: false

databases:
  - name: bookshop-postgres
    databaseName: bookshop
    user: bookshop
